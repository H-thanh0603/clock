services:
  db:
    image: postgres:18-alpine
    container_name: aurel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aurel
    ports:
      # host 5433 để trùng DATABASE_URL mẫu (tránh đụng postgres có sẵn trên 5432)
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
