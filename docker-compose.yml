services:
  db:
    image: postgres:18-alpine
    container_name: aurel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aurel
    ports:
      # host 5433 để trùng DATABASE_URL mẫu (tránh đụng postgres có sẵn trên 5432)
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: aurel-backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PORT: 4000
      FRONTEND_URL: "http://localhost:3000"
      BACKEND_PUBLIC_URL: "http://localhost:4000"
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/aurel"
      JWT_SECRET: "thay-bang-chuoi-ngau-nhien-64-ky-tu"
      VNPAY_TMN_CODE: ""
      VNPAY_HASH_SECRET: ""
    ports:
      - "4000:4000"

volumes:
  pgdata:
