services:
  # Meilisearch — typo-tolerance search cho catalog (optional: backend
  # fallback Prisma contains khi MEILI_HOST trống/service chết).
  meilisearch:
    image: getmeili/meilisearch:v1.53.2
    container_name: aurel-meili
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-meili-key-0123456789}
      MEILI_ENV: development
    volumes:
      - meili_data:/var/lib/meilisearch
    ports:
      - "7700:7700"
    healthcheck:
      # /health không cần auth (luôn public kể cả khi có master key).
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:18-alpine
    container_name: aurel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aurel
    ports:
      # host 5433 để trùng DATABASE_URL mẫu (tránh đụng postgres có sẵn trên 5432)
      - "5433:5432"
    volumes:
      # Postgres 18+ yêu cầu mount ở /var/lib/postgresql (data nằm trong
      # subdirectory) — mount /data cũ bị image từ chối khởi động.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # Context repo-root: Dockerfile copy dữ liệu FE (src/data) cho seed
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aurel-backend
    restart: unless-stopped
    depends_on:
      - db
      - meilisearch
    environment:
      PORT: 4000
      # Image backend set NODE_ENV=production ở run stage — compose dev phải
      # override về development, nếu không method thanh toán mô phỏng tắt
      # (trái README: dev/demo bật) và e2e không đặt được đơn mô phỏng.
      NODE_ENV: development
      FRONTEND_URL: "http://localhost:3000,http://localhost:3100"
      BACKEND_PUBLIC_URL: "http://localhost:4000"
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/aurel"
      JWT_SECRET: "thay-bang-chuoi-ngau-nhien-64-ky-tu"
      VNPAY_TMN_CODE: ""
      VNPAY_HASH_SECRET: ""
      MEILI_HOST: "http://meilisearch:7700"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-meili-key-0123456789}
    ports:
      - "4000:4000"

  agent:
    # AI agents (FastAPI :8100) — vendor commerce-agents + adapter REST clock.
    # Chưa có AGENT_API_KEY thì /health vẫn OK, chat trả 503 hướng dẫn.
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: aurel-agent
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      AUREL_BACKEND_URL: "http://backend:4000"
      AUREL_FRONTEND_URL: "http://localhost:3100"
      AGENT_BASE_URL: ${AGENT_BASE_URL:-}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-claude-sonnet-5}
      AGENT_AUTH_HEADER: ${AGENT_AUTH_HEADER:-x-api-key}
      # Jev TypeSafe (decision model: handoff/triage/alert-gate/injection/intent).
      # Thiếu key → Jev tắt im lặng, fallback heuristic — KHÔNG lỗi.
      JEV_API_KEY: ${JEV_API_KEY:-}
      JEV_URL: ${JEV_URL:-https://api.typesafe.ai/v1/systemone}
      JEV_MODEL: ${JEV_MODEL:-jev-latest}
      JEV_THRESHOLD: ${JEV_THRESHOLD:-0.7}
      JEV_TIMEOUT_S: ${JEV_TIMEOUT_S:-5.0}
      # Fallback + memory model (rỗng = tắt / dùng model chính).
      AGENT_FALLBACK_MODEL: ${AGENT_FALLBACK_MODEL:-}
      AGENT_MEMORY_MODEL: ${AGENT_MEMORY_MODEL:-}
      AGENT_MERCHANT_TOKEN: ${AGENT_MERCHANT_TOKEN:-}
      AGENT_CHAT_RATE_LIMIT_PER_MIN: ${AGENT_CHAT_RATE_LIMIT_PER_MIN:-60}
    ports:
      - "8100:8100"
    volumes:
      - ./agent/data:/app/data

volumes:
  pgdata:
  meili_data:
