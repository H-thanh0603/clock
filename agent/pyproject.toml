# Cài đặt phần AI Agent (shopping + merchant agent chạy trên nền commerce-agents
# của Anthropic, đã vendor tại agent/vendor/). Xem agent/README.md.

[project]
name = "aurel-agents"
version = "0.1.0"
description = "Shopping & merchant AI agents cho Aurel & Co. (đồ án clock), adapter qua REST API NestJS"
requires-python = ">=3.11"
# Runtime deps nằm ở requirements.txt (gồm 5 package editable từ vendor/).
# pip install -e . chỉ dùng cho metadata package aurel_agents.
dependencies = [
    "httpx>=0.28",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.6",
]

[tool.setuptools]
packages = ["aurel_agents", "aurel_agents.shopping", "aurel_agents.merchant"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
