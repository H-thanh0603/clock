name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
        env:
          BACKEND_URL: http://localhost:4000
          NEXT_PUBLIC_BACKEND_URL: /backend

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx prisma generate
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm test
      - run: npm run build

  # E2E luồng mua hàng thật (P2-4): Postgres service + backend dev + FE dev,
  # Playwright chạy spec e2e/. Method mô phỏng bật (NODE_ENV=development).
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aurel
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/aurel
      JWT_SECRET: e2e-test-secret-du-32-ky-tu-cho-ci
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Backend — deps + migrate + seed + start
        run: |
          cd backend
          npm ci
          npx prisma migrate deploy
          npm run seed
          npm run build
          (PORT=4000 FRONTEND_URL=http://localhost:3000,http://localhost:3100 BACKEND_PUBLIC_URL=http://localhost:4000 npm run start > /tmp/backend.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4000/health && break
            sleep 2
          done
      - name: Frontend — deps + browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright e2e
        run: npx playwright test
        env:
          BACKEND_URL: http://localhost:4000
          NEXT_PUBLIC_BACKEND_URL: http://localhost:4000
      - name: Log backend khi fail
        if: failure()
        run: tail -100 /tmp/backend.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/

  # Ops scripts: backup/restore/offsite/drift — chạy với docker/rclone giả
  # (không cần daemon). Bắt regression ở chain backup trước khi deploy.
  ops-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S warning scripts/*.sh
      - name: Bash syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: Test backup/restore/offsite/drift
        run: ./scripts/tests/run.sh

  # AI agent: unit/adapter + eval hành vi + upstream Anthropic nguyên bản.
  # Eval chạy bằng model GIẢ scripted (offline, 0 token) — đủ để bắt hồi quy
  # prompt/tool/fence. Model thật chạy tay: python -m evals.run --live.
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ruff
        run: ruff check .
      - name: Pytest (unit + adapter + eval)
        run: pytest -q
        env:
          AGENT_API_KEY: ""
          JEV_API_KEY: ""
