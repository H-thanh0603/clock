name: Deploy production

# Chạy tay sau khi CI xanh: Actions → Deploy production → Run workflow.
# Cần khai báo Secrets trên repo (Settings → Secrets → Actions):
#   VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_DIR (vd /opt/clock)
#
# Thứ tự cố định (audit OPS-001): backup → build ảnh mới → MIGRATE →
# rồi mới thay container. Không còn cửa sổ "code mới chạy schema cũ".
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy code lên VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: ${{ secrets.VPS_DIR }}
          rm: false

      # Bước 1-3: backup, build ảnh mới, migrate — service đang chạy
      # vẫn dùng ảnh cũ, khách không thấy gì khác thường.
      - name: Backup + build + migrate (không thay container)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_DIR }}
            # backup phòng rollback trước mỗi deploy
            ./scripts/backup-db.sh "-f docker-compose.prod.yml --env-file .env.prod" 14 || true
            # Build ảnh MỚI nhưng chưa swap: chỉ tạo image, không up.
            docker compose -f docker-compose.prod.yml --env-file .env.prod build
            # Migrate DB TRƯỚC khi container mới chạy (ảnh backend
            # đã có prisma CLI + migrations; chạy one-shot, thoát ngay).
            docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm --no-deps backend npx prisma migrate deploy

      # Bước 4: mới thay container — schema đã sẵn, code mới chạy ngay.
      # Chỉ up service stateless + meili + db-offsite: KHÔNG đụng db/db-backup
      # (tránh restart DB không cần thiết gây downtime ghi đơn).
      - name: Restart stack với ảnh mới
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_DIR }}
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d backend frontend agent caddy meilisearch db-offsite
            # Smoke test sau deploy (P1-7): backend + frontend phải sống thì
            # deploy mới coi là xong. Fail ở đây = workflow đỏ, operator vào
            # kiểm tra ngay (chưa auto-rollback — rollback tay theo PRODUCTION.md §6).
            for i in $(seq 1 12); do
              if docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T backend node -e "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))" \
                && docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T frontend node -e "fetch('http://localhost:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"; then
                echo "✅ smoke test pass (lần thử $i)"
                break
              fi
              if [ "$i" = "12" ]; then
                echo "❌ SMOKE TEST FAIL sau 2 phút — kiểm tra ngay!" >&2
                docker compose -f docker-compose.prod.yml --env-file .env.prod ps
                docker compose -f docker-compose.prod.yml --env-file .env.prod logs backend --tail 50
                docker compose -f docker-compose.prod.yml --env-file .env.prod logs frontend --tail 50
                exit 1
              fi
              sleep 10
            done
            docker compose -f docker-compose.prod.yml ps
