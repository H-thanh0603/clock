name: Deploy production

# Chạy tay sau khi CI xanh: Actions → Deploy production → Run workflow.
# Cần khai báo Secrets trên repo (Settings → Secrets → Actions):
#   VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_DIR (vd /opt/clock)
#
# Thứ tự cố định (audit OPS-001): backup → build ảnh mới → MIGRATE →
# rồi mới thay container. Không còn cửa sổ "code mới chạy schema cũ".
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy code lên VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: ${{ secrets.VPS_DIR }}
          rm: false

      # Bước 1-3: backup, build ảnh mới, migrate — service đang chạy
      # vẫn dùng ảnh cũ, khách không thấy gì khác thường.
      - name: Backup + build + migrate (không thay container)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_DIR }}
            # backup phòng rollback trước mỗi deploy
            ./scripts/backup-db.sh "-f docker-compose.prod.yml --env-file .env.prod" 14 || true
            # Build ảnh MỚI nhưng chưa swap: chỉ tạo image, không up.
            docker compose -f docker-compose.prod.yml --env-file .env.prod build
            # Migrate DB TRƯỚC khi container mới chạy (ảnh backend
            # đã có prisma CLI + migrations; chạy one-shot, thoát ngay).
            docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm --no-deps backend npx prisma migrate deploy

      # Bước 4: mới thay container — schema đã sẵn, code mới chạy ngay.
      - name: Restart stack với ảnh mới
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_DIR }}
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
            # Chờ healthcheck rồi in trạng thái; lỗi thì in log để debug.
            sleep 10
            docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml logs backend --tail 50
