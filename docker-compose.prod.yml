# Production stack: Caddy (TLS) + frontend + backend + Postgres.
# Chuẩn bị:
#   1. Trỏ DNS A của $DOMAIN về IP VPS.
#   2. cp .env.prod.example .env.prod && điền secret thật.
#   3. docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#   4. Chạy migrate lần đầu: docker compose -f docker-compose.prod.yml exec backend npx prisma migrate deploy
#      (các lần sau CI lo; xem .github/workflows).
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD chưa đặt trong .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-aurel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Meilisearch — typo-tolerance search cho catalog. Backend fallback
  # Prisma nếu service chết, nên không critical-path.
  meilisearch:
    image: getmeili/meilisearch:v1.53.2
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY chưa đặt}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/var/lib/meilisearch
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - uploads:/app/uploads
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_started
    environment:
      PORT: 4000
      NODE_ENV: production
      FRONTEND_URL: "https://${DOMAIN:?DOMAIN chưa đặt}"
      BACKEND_PUBLIC_URL: "https://${DOMAIN:?DOMAIN chưa đặt}/backend"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD chưa đặt}@db:5432/${POSTGRES_DB:-aurel}"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET chưa đặt trong .env.prod}
      # Cost bcrypt cho hash mật khẩu (4-15, prod nên 12 — ~250ms/hash).
      BCRYPT_COST: ${BCRYPT_COST:-12}
      COOKIE_SAMESITE: lax
      COOKIE_SECURE: "true"
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_ENV: ${VNPAY_ENV:-sandbox}
      # TTL URL thanh toán VNPay (phút) — hết hạn thì cổng từ chối giao dịch.
      VNPAY_URL_TTL_MINUTES: ${VNPAY_URL_TTL_MINUTES:-30}
      # Giới hạn đơn PENDING (giờ) cho cron expire — gợi ý prod: 2-6h.
      ORDER_PENDING_TTL_HOURS: ${ORDER_PENDING_TTL_HOURS:-6}
      UPLOADS_DIR: /app/uploads
      MEILI_HOST: "http://meilisearch:7700"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY chưa đặt}
      # --- Ảnh upload S3 (bỏ trống = disk volume) ---
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      S3_PUBLIC_BASE: ${S3_PUBLIC_BASE:-}
      # --- Thông báo concierge (optional) ---
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # --- Hóa đơn điện tử (optional) ---
      EINVOICE_PROVIDER: ${EINVOICE_PROVIDER:-}
      EINVOICE_API_URL: ${EINVOICE_API_URL:-}
      EINVOICE_API_KEY: ${EINVOICE_API_KEY:-}
      # --- Sentry (optional; bỏ trống = noop an toàn) ---
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-prod-vps}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Backup định kỳ không phụ thuộc crontab VPS: pg_dump mỗi sáng 02:00,
  # giữ 14 bản (BACKUP_KEEP), mount ./backups ra host để rsync/S3 tiếp.
  db-backup:
    image: postgres:18-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD chưa đặt trong .env.prod}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGDATABASE: ${POSTGRES_DB:-aurel}
      KEEP: ${BACKUP_KEEP:-14}
      # Passthrough cho scripts/offsite-backup.sh đọc (không dùng trong container).
      OFFSITE_REMOTE: ${OFFSITE_REMOTE:-}
    entrypoint:
      - /bin/sh
      - -c
      - |
        i=0
        while true; do
          STAMP=$$(date +%Y%m%d-%H%M%S)
          FILE="/backups/aurel-$$STAMP.sql.gz"
          if pg_dump -h db -U "$$PGUSER" "$$PGDATABASE" | gzip > "$$FILE"; then
            echo "[backup] $$FILE ok"
            # Verify mỗi 7 lần (~tuần 1): restore thử vào DB scratch.
            # Backup chưa restore thử = chưa có backup.
            i=$$((i+1))
            if [ $$((i % 7)) -eq 0 ]; then
              VDB="verify_$$STAMP"
              if createdb -h db -U "$$PGUSER" "$$VDB" \
                 && gunzip -c "$$FILE" | psql -h db -U "$$PGUSER" -d "$$VDB" -v ON_ERROR_STOP=1 -q >/dev/null 2>&1 \
                 && ORIG=$$(psql -h db -U "$$PGUSER" -d "$$PGDATABASE" -tAc "SELECT count(*) FROM pg_tables WHERE schemaname='public';") \
                 && REST=$$(psql -h db -U "$$PGUSER" -d "$$VDB" -tAc "SELECT count(*) FROM pg_tables WHERE schemaname='public';") \
                 && [ "$$ORIG" = "$$REST" ]; then
                echo "[backup-verify] OK $$STAMP: restore thử + $$REST bảng khớp"
              else
                echo "[backup-verify] FAIL $$STAMP — KIỂM TRA BACKUP!" >&2
              fi
              dropdb -h db -U "$$PGUSER" "$$VDB" 2>/dev/null || true
            fi
          else
            echo "[backup] FAIL $$STAMP" >&2
          fi
          ls -1t /backups/aurel-*.sql.gz 2>/dev/null | tail -n +$$(($$KEEP + 1)) | xargs -r rm -f
          NOW=$$(date +%s)
          NEXT=$$(( $$(date -d tomorrow +%s) + 2*3600 ))
          sleep $$(( NEXT - NOW > 0 ? NEXT - NOW : 86400 ))
        done
    volumes:
      - ./backups:/backups

  # Offsite layer 2 (rclone): đẩy backup mới nhất lên remote + xoá bản remote
  # quá hạn. Chạy trong compose để KHÔNG phụ thuộc crontab VPS (cron trên host
  # hay bị quên khi dựng máy mới). Bỏ trống OFFSITE_REMOTE → service ngủ êm,
  # backup local vẫn nguyên (không coi là lỗi hạ tầng).
  db-offsite:
    image: rclone/rclone:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      OFFSITE_REMOTE: ${OFFSITE_REMOTE:-}
      OFFSITE_KEEP: ${OFFSITE_KEEP:-30}
    volumes:
      - ./backups:/backups:ro
      # rclone.conf mount read-only — remote (B2/S3) cấu hình 1 lần trên host.
      - ${OFFSITE_RCLONE_CONFIG:-/dev/null}:/config/rclone/rclone.conf:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$OFFSITE_REMOTE" ]; then
          echo "[offsite] OFFSITE_REMOTE trống — chỉ giữ backup local."
          sleep infinity
        fi
        while true; do
          # Đợi bản backup hôm nay (db-backup chạy 02:00) rồi mới đẩy.
          LATEST=$$(ls -1t /backups/aurel-*.sql.gz 2>/dev/null | head -1)
          if [ -z "$$LATEST" ]; then
            echo "[offsite] chưa có backup local, thử lại sau." >&2
          else
            echo "[offsite] đẩy $$LATEST -> $$OFFSITE_REMOTE/"
            if rclone copyto "$$LATEST" "$$OFFSITE_REMOTE/$$(basename "$$LATEST")" --stats-one-line; then
              # Verify: remote phải có file cùng size (không đẩy nửa vời).
              # `lsl` in ra "<size> <date> <time> <name>" — lấy cột 1.
              REMOTE_SIZE=$$(rclone lsl "$$OFFSITE_REMOTE/$$(basename "$$LATEST")" 2>/dev/null | awk 'NR==1{print $$1}')
              LOCAL_SIZE=$$(stat -c %s "$$LATEST" 2>/dev/null || echo 0)
              if [ -n "$$REMOTE_SIZE" ] && [ "$$REMOTE_SIZE" = "$$LOCAL_SIZE" ] && [ "$$LOCAL_SIZE" != "0" ]; then
                echo "[offsite] OK $$(basename "$$LATEST") ($$LOCAL_SIZE bytes)"
              else
                echo "[offsite] SIZE LỆCH remote=$$REMOTE_SIZE local=$$LOCAL_SIZE — KIỂM TRA!" >&2
              fi
              # Giữ vòng đời remote dài hơn local (local 14 bản ~2 tuần,
              # remote 30 bản ~1 tháng) — bảo vệ trước hỏng dữ liệu âm thầm
              # lan sang cả bản local đã bị xoay vòng.
              rclone delete "$$OFFSITE_REMOTE/" --min-age "$${OFFSITE_KEEP}d" 2>/dev/null || true
            else
              echo "[offsite] FAIL $$(basename "$$LATEST") — KIỂM TRA BACKUP OFFSITE!" >&2
            fi
          fi
          NOW=$$(date +%s)
          NEXT=$$(( $$(date -d tomorrow +%s) + 3*3600 ))
          sleep $$(( NEXT - NOW > 0 ? NEXT - NOW : 86400 ))
        done

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: "https://${DOMAIN:?DOMAIN chưa đặt}/backend"
        NEXT_PUBLIC_AGENT_URL: "https://${DOMAIN:?DOMAIN chưa đặt}/agent"
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-prod-vps}
        SITE_URL: "https://${DOMAIN:?DOMAIN chưa đặt}"
        NEXT_PUBLIC_MEDIA_BASE_URL: ${NEXT_PUBLIC_MEDIA_BASE_URL:-}
      # Proxy server-side /api/agent/* → agent host (giữ token ở server).
      # KHÔNG phải NEXT_PUBLIC_* — xuống browser là lộ token merchant.
      AGENT_INTERNAL_URL: "http://agent:8100"
      AGENT_MERCHANT_TOKEN: ${AGENT_MERCHANT_TOKEN:-}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: "http://backend:4000"
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      SITE_URL: "https://${DOMAIN:?DOMAIN chưa đặt}"
    healthcheck:
      # FE chết thì Caddy vẫn proxy vào — phải có healthcheck để ps/metrics
      # thấy được (audit OPS-002).
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  agent:
    build: ./agent
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      AUREL_BACKEND_URL: "http://backend:4000"
      AUREL_FRONTEND_URL: "https://${DOMAIN:?DOMAIN chưa đặt}"
      AGENT_BASE_URL: ${AGENT_BASE_URL:-}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-claude-sonnet-5}
      AGENT_AUTH_HEADER: ${AGENT_AUTH_HEADER:-x-api-key}
      # Jev TypeSafe (decision model: handoff/triage/alert-gate/injection/intent).
      # Thiếu key → Jev tắt im lặng, fallback heuristic — KHÔNG lỗi, nhưng
      # recall khiếu nại ngầm ý tụt từ 4/6 về 1/6 (benchmark 2026-09-20).
      JEV_API_KEY: ${JEV_API_KEY:-}
      JEV_URL: ${JEV_URL:-https://api.typesafe.ai/v1/systemone}
      JEV_MODEL: ${JEV_MODEL:-jev-latest}
      JEV_THRESHOLD: ${JEV_THRESHOLD:-0.7}
      JEV_TIMEOUT_S: ${JEV_TIMEOUT_S:-5.0}
      # Model fallback khi gateway 429/overloaded (rỗng = không fallback).
      AGENT_FALLBACK_MODEL: ${AGENT_FALLBACK_MODEL:-}
      # Model riêng cho memory extraction (rỗng = dùng AGENT_MODEL).
      AGENT_MEMORY_MODEL: ${AGENT_MEMORY_MODEL:-}
      AGENT_MERCHANT_TOKEN: ${AGENT_MERCHANT_TOKEN:-}
      # Fail-closed: thiếu token merchant thì host không khởi động (tránh
      # mở endpoint vận hành ra Internet). Nhớ đặt AGENT_MERCHANT_TOKEN.
      AGENT_REQUIRE_MERCHANT_TOKEN: "1"
      AGENT_CHAT_RATE_LIMIT_PER_MIN: ${AGENT_CHAT_RATE_LIMIT_PER_MIN:-60}
      # Trần tiền LLM toàn host (turn/ngày). 0 = tắt (không khuyến nghị).
      AGENT_GLOBAL_TURNS_PER_DAY: ${AGENT_GLOBAL_TURNS_PER_DAY:-1000}
      AGENT_SHOPPER_EMAIL: ${AGENT_SHOPPER_EMAIL:-agent-shopper@aurel.local}
      AGENT_SHOPPER_PASSWORD: ${AGENT_SHOPPER_PASSWORD:-}
      AGENT_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@aurel.local}
      AGENT_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - agent-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
      - agent
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN chưa đặt trong .env.prod}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  agent-data:
  meili_data:
  caddy_data:
  caddy_config:
